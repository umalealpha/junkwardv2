[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ── PHP-FPM ───────────────────────────────────────────────
[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

; ── Nginx (serves cron dashboard at port 80) ──────────────
[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

; ── PHP Laravel scheduler (runs every minute) ─────────────
; schedule:run executes all due commands in the FOREGROUND and only returns
; once they all finish. Without a timeout, a single hanging/very-slow command
; (e.g. an external call with no timeout) freezes this loop indefinitely — so
; every cron scheduled after it silently stops firing until the container is
; restarted. This was the root cause of evening crons (matiUpdateKycDocuments,
; policyRenewUpdateData, updateorangereferencenumbers, sendpolicydocument...
; etc.) dying for weeks while morning crons ran fine. `timeout 900` caps any
; single schedule:run pass at 15 min, so a hung command is killed and the loop
; resumes — far longer than any legitimate batch (all observed finish <2 min).
[program:scheduler]
command=sh -c "while true; do timeout 900 php /var/www/html/artisan schedule:run --no-interaction 2>&1; sleep 60; done"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

; ── System crond daemon (Alpine/dcron) — runs Python finance engine jobs ──
[program:crond]
command=crond -f -d 8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

; ── Laravel queue worker (drains Redis queue: emails, SMS, dispatched jobs) ──
; Previously NO queue worker existed in any container, so every Mail::queue(),
; dispatch(...) or notification ->queue() call sat in Redis forever. That is
; why the Communications Delivery Logs page was empty (CFO 11 PM #12) and
; why outbound customer comms (renewal reminders, payment receipts, KYC
; nudges) were never delivered after switch to QUEUE_CONNECTION=redis.
;
; --tries=3                three attempts, then job lands in failed_jobs
; --max-time=3600          recycle the worker after one hour to release memory
;                          (Laravel queue workers leak slowly; periodic restart
;                           is the standard mitigation)
; --sleep=3                idle 3s between empty-queue polls (cheap CPU)
; --backoff=10             pause 10s after a job failure before the retry
; stopwaitsecs=3600        let supervisord wait up to one hour for the current
;                          job to finish on a graceful stop (graceful drain)
;
; priority=15 — start AFTER scheduler/crond (which are 10) and AFTER nginx (10)
; so Redis/cache/sessions are already warm when the worker connects.
;
; Plays nicely with the queue:restart admin endpoint (POST /api/v1/system/
; restart-queue) added in commit 5d88915d9: that endpoint signals workers to
; exit gracefully after their current job; supervisord then autorestarts them
; with the freshly-deployed code. Without this block, that endpoint was a
; no-op on prod because there were no workers to signal.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --max-time=3600 --sleep=3 --backoff=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopwaitsecs=3600
priority=15
