version: 0.2
# CodeBuild project: graphite-pdf-service-build
# Source: alphadirectinsurance/Graphitev2, path filter: pdf-service/**

phases:
  pre_build:
    commands:
      - echo "== pdf-service build =="
      - aws --version
      - docker --version
      - REGION=${AWS_DEFAULT_REGION:-af-south-1}
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPO=graphite-pdf-service
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO
      - echo "Target ECR URI $ECR_URI"
      - aws ecr describe-repositories --repository-names $REPO --region $REGION >/dev/null 2>&1 || aws ecr create-repository --repository-name $REPO --region $REGION
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_URI
      - TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)

  build:
    commands:
      - cd pdf-service
      - docker build -t $ECR_URI:$TAG -t $ECR_URI:latest .
      - docker push $ECR_URI:$TAG
      - docker push $ECR_URI:latest

  post_build:
    commands:
      - echo "Forcing new deployment for graphite-pdf-service"
      - aws ecs update-service --cluster graphite-cluster --service graphite-pdf-service --force-new-deployment --region $REGION || echo "service not yet created — skip"
