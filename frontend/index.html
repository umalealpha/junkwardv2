<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <!-- Fonts are self-hosted via @fontsource-variable (imported in src/main.tsx),
         no external Google Fonts CDN dependency. -->
    <title>Alpha Direct Portal</title>
    <!-- Apply the stored/system theme BEFORE React mounts to avoid a flash of
         the wrong theme. Mirrors src/hooks/useTheme.ts (key: graphite-theme). -->
    <script>
      (function () {
        try {
          // TEMP (2026-07): dark mode still has contrast issues in prod — only go
          // dark for an explicit stored 'dark' choice (absent/'system'/'light' → light)
          // so no one lands on dark unless they toggled it. Restore prefers-color-scheme once dark-mode QA is signed off.
          var dark = (localStorage.getItem('graphite-theme') === 'dark');
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
