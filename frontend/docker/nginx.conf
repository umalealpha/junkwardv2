server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # M3 (pentest) — security response headers. NOTE: nginx does NOT inherit
    # add_header into a location that declares its own add_header, so these are
    # repeated in the caching locations below to guarantee coverage on every
    # response. Content-Security-Policy is intentionally deferred — it needs
    # SPA-specific tuning (inline styles/scripts, asset origins) before it can
    # be enforced without breaking the app; add it once a report-only policy has
    # been validated.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # CSP in REPORT-ONLY first (per the note above) — this observes violations
    # without blocking, so the policy can be tuned before it is enforced.
    # Promote to Content-Security-Policy once the reports are clean.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://graphite-v2-be.alphadirect.co.bw https://bridge.alphadirect.co.bw; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # SPA routing — all routes go to index.html (inherits the server-level
    # security headers above, since this location has no add_header of its own)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (re-declares the security headers — see note above,
    # otherwise the Cache-Control add_header would drop them for these responses)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # CSP in REPORT-ONLY first (per the note above) — this observes violations
    # without blocking, so the policy can be tuned before it is enforced.
    # Promote to Content-Security-Policy once the reports are clean.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://graphite-v2-be.alphadirect.co.bw https://bridge.alphadirect.co.bw; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    # Don't cache index.html (re-declares the security headers — see note above)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # CSP in REPORT-ONLY first (per the note above) — this observes violations
    # without blocking, so the policy can be tuned before it is enforced.
    # Promote to Content-Security-Policy once the reports are clean.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://graphite-v2-be.alphadirect.co.bw https://bridge.alphadirect.co.bw; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
