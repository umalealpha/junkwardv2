<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Direct — Claims Document Generator</title>
<style>
  :root{ --navy:#1D3270; --orange:#F47C20; --ink:#1a2233; --line:#d8deea; --bg:#eef1f6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
  /* ---- control panel ---- */
  .panel{background:#fff;border-right:1px solid var(--line);padding:18px 18px 60px;overflow:auto;height:100vh}
  .panel h1{font-size:15pt;color:var(--navy);margin:0 0 2px}
  .panel .sub{color:#66708a;font-size:9.5pt;margin:0 0 16px}
  .fld{margin:0 0 10px}
  .fld label{display:block;font-size:8.5pt;text-transform:uppercase;letter-spacing:.4px;color:#66708a;margin:0 0 3px}
  .fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:10.5pt;font-family:inherit}
  .fld textarea{min-height:64px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pick{border:2px solid var(--navy);border-radius:8px;padding:9px;font-weight:600;color:var(--navy);background:#f4f6fb}
  .flag{background:#fff5e9;border-left:3px solid var(--orange);padding:8px 10px;border-radius:4px;font-size:9pt;color:#8a4b12;margin:8px 0 14px}
  .btns{position:sticky;bottom:0;background:#fff;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;padding:10px;border:0;border-radius:7px;font-weight:600;font-size:10.5pt;cursor:pointer}
  .btn.p{background:var(--orange);color:#fff}
  .btn.s{background:#e9edf4;color:var(--navy)}
  .grp{border-top:1px solid var(--line);margin:14px 0 8px;padding-top:12px;font-size:8.5pt;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);font-weight:700}
  /* ---- document preview ---- */
  .stage{padding:26px;overflow:auto;height:100vh}
  .page{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:20mm 20mm 16mm;box-shadow:0 6px 26px rgba(20,30,60,.16);font-size:11pt;line-height:1.5;color:#111}
  .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--orange);padding-bottom:10px;margin-bottom:4px}
  .lh .logo{font-size:20pt;font-weight:800;color:var(--navy);letter-spacing:.3px;line-height:1}
  .lh .logo em{color:var(--orange);font-style:italic}
  .lh .logo small{display:block;font-size:8.5pt;font-weight:600;color:#66708a;letter-spacing:2px;margin-top:2px}
  .lh .logo-img{height:44px;width:auto;display:block}
  .lh .co{text-align:right;font-size:8pt;color:#66708a;line-height:1.45}
  .doctitle{text-align:center;margin:10px 0 2px}
  .doctitle h2{font-size:15pt;color:var(--navy);margin:0;text-transform:uppercase;letter-spacing:.5px}
  .wp{text-align:center;font-size:9pt;letter-spacing:2px;color:#B85C10;font-weight:700;margin:2px 0 0}
  .approve{text-align:center;font-size:8.5pt;color:#8a4b12;margin:2px 0 9px}
  .meta{width:100%;border-collapse:collapse;margin:5px 0 9px;font-size:10pt}
  .meta td{padding:4px 8px;border:1px solid var(--line)}
  .meta td.k{background:#f4f6fb;font-weight:600;width:34%}
  .body p{margin:0 0 6px;text-align:justify}
  .fin{width:100%;border-collapse:collapse;margin:6px 0 9px;font-size:10.5pt}
  .fin td{padding:5px 9px;border:1px solid var(--line)}
  .fin td.amt{text-align:right;width:34%}
  .fin tr.tot td{background:var(--navy);color:#fff;font-weight:700}
  .sign{display:flex;justify-content:space-between;gap:30px;margin-top:20px}
  .sign .s{flex:1;text-align:center;font-size:9.5pt;color:#333}
  .sign .l{border-top:1px solid #333;margin-bottom:4px;padding-top:26px}
  .docfoot{margin-top:26px;border-top:1px solid var(--line);padding-top:8px;font-size:7.5pt;color:#8a93a1;text-align:center}
  .draft-note{background:#fff5e9;border:1px dashed var(--orange);color:#8a4b12;font-size:8.5pt;padding:5px 8px;border-radius:4px;margin:0 0 12px}
  @media print{
    body{background:#fff}
    .panel{display:none}
    .app{grid-template-columns:1fr}
    .stage{padding:0;height:auto;overflow:visible}
    .page{box-shadow:none;width:auto;min-height:auto;margin:0;padding:11mm 15mm}
    .draft-note{display:none}
    @page{size:A4;margin:0}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ CONTROL PANEL ============ -->
  <div class="panel">
    <h1>Claims Document Generator</h1>
    <p class="sub">Alpha Direct — Claims Department. Fill the fields, then <b>Print → Save as PDF</b>.</p>

    <div class="fld">
      <label>Document type</label>
      <select id="doctype" class="pick" onchange="render()">
        <option value="aol">Agreement of Loss / Tax Invoice</option>
        <option value="cil">Cash in Lieu of Repairs</option>
        <option value="exg">Ex Gratia Offer</option>
        <option value="release">Form of Release</option>
        <option value="refund">Refund Memo</option>
        <option value="towing">Towing Authorisation</option>
        <option value="flag">Claim Flagging Form</option>
      </select>
    </div>
    <div id="typeflag" class="flag"></div>

    <div class="grp">Claim details</div>
    <div class="fld"><label>Insured / Claimant name</label><input id="insured" oninput="render()" value="Kabo Motors (Pty) Ltd"></div>
    <div class="row2">
      <div class="fld"><label>Claim number</label><input id="claimno" oninput="render()" value="G2026004512"></div>
      <div class="fld"><label>Policy number</label><input id="policyno" oninput="render()" value="MIS2025071234"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Vehicle registration</label><input id="reg" oninput="render()" value="B 771 AQP"></div>
      <div class="fld"><label>Date of loss</label><input id="dol" oninput="render()" value="14 May 2026"></div>
    </div>
    <div class="fld"><label>Brief description of the loss</label><textarea id="desc" oninput="render()">The insured reports that on 14 May 2026 the vehicle was involved in a collision along the A1 near Pilane, resulting in front-end damage.</textarea></div>

    <div class="grp">Amounts (BWP)</div>
    <div class="row2">
      <div class="fld"><label>Current value / claim cost (VAT incl.)</label><input id="value" oninput="render()" value="185,000.00"></div>
      <div class="fld"><label>Less excess</label><input id="excess" oninput="render()" value="3,500.00"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>Less upcoming debits</label><input id="debits" oninput="render()" value="0.00"></div>
      <div class="fld"><label>Total payable</label><input id="total" oninput="render()" value="181,500.00"></div>
    </div>
    <div class="fld"><label>Payee / bank (cash-in-lieu, refund, towing)</label><input id="payee" oninput="render()" value="Motovac (Pty) Ltd"></div>
    <div class="fld"><label>Extra line (towing route / refund reason / flag reason)</label><input id="extra" oninput="render()" value="From accident scene, Pilane, to Alpha Direct approved yard, Gaborone"></div>

    <div class="btns">
      <button class="btn s" onclick="location.reload()">Reset</button>
      <button class="btn p" onclick="window.print()">Print / PDF</button>
    </div>
  </div>

  <!-- ============ DOCUMENT PREVIEW ============ -->
  <div class="stage"><div class="page" id="page"></div></div>
</div>

const FOOT = `<div class="docfoot">Alpha Direct Insurance Company (Pty) Ltd &nbsp;|&nbsp; Reg. CO2012/13738 &nbsp;|&nbsp; Regulated by NBFIRA &nbsp;|&nbsp; Confidential</div>`;
const signBlock = (a,b)=>`<div class="sign"><div class="s"><div class="l"></div>${a}</div><div class="s"><div class="l"></div>${b}</div></div>`;

// which forms are faithful to the pulled Word template vs standard draft wording
const FAITHFUL = { aol:true, cil:true };
const FLAGTXT = {
  aol:"Faithful to the Claims Word template (Agreement of Loss / Tax Invoice).",
  cil:"Faithful to the Claims Word template (Cash in Lieu of Repairs).",
  exg:"DRAFT wording — confirm against the Claims 'EXGRATIA' Word file before use.",
  release:"DRAFT wording — confirm against the Claims 'FORM OF RELEASE' Word file before use.",
  refund:"DRAFT wording — confirm against the Claims 'REFUND MEMO' Word file before use.",
  towing:"DRAFT wording — confirm against the Claims 'TOWING AUTHORISATION' Word file before use.",
  flag:"DRAFT wording — confirm against the Claims 'FLAGGING FORM' Word file before use."
};

function metaRows(){
  return `<table class="meta">
    <tr><td class="k">Insured</td><td>${$('insured')}</td></tr>
    <tr><td class="k">Claim Number</td><td>${$('claimno')}</td></tr>
    <tr><td class="k">Policy Number</td><td>${$('policyno')}</td></tr>
    <tr><td class="k">Vehicle Registration</td><td>${$('reg')}</td></tr>
  </table>`;
}
function finRows(valueLabel){
  return `<table class="fin">
    <tr><td>${valueLabel} (VAT inclusive)</td><td class="amt">BWP ${$('value')}</td></tr>
    <tr><td>Less: Excess</td><td class="amt">(BWP ${$('excess')})</td></tr>
    <tr><td>Less: Upcoming debits</td><td class="amt">(BWP ${$('debits')})</td></tr>
    <tr class="tot"><td>Total Claim Payable</td><td class="amt">BWP ${$('total')}</td></tr>
  </table>`;
}

const TEMPLATES = {
  // ---- Agreement of Loss (faithful to pulled template) ----
  aol: () => `
    <div class="doctitle"><h2>Agreement of Loss / Tax Invoice</h2></div>
    <div class="wp">WITHOUT PREJUDICE</div>
    <div class="approve">Payment is subject to Senior Management's approval</div>
    ${metaRows()}
    <div class="body">
      <p>I/we, the undersigned, <b>${$('insured')}</b>, agree to accept payment of the sum of
      <b>BWP ${$('total')}</b> from Alpha Direct Insurance Company in full and final settlement and
      satisfaction for myself, my heirs, executors, administrators and assigns for all claims, damages
      and costs of whatsoever kind or nature, whether now or hereinafter to become manifest, resulting
      from a loss that occurred on or about <b>${$('dol')}</b> to the vehicle insured hereunder
      (${$('policyno')}).</p>
      <p><b>Brief description of the loss:</b> ${$('desc')}</p>
      ${finRows('Current Value')}
      <p>If, after payment of a claim in respect of lost or stolen property, the property (or any part
      thereof) is located, I/we undertake to render all assistance in its identification and physical
      recovery, and any expense in rendering such assistance shall be reimbursed by the Company. Should
      I/we fail to render assistance when called upon, I/we shall immediately become liable to repay the
      Company all amounts paid in respect of the claim.</p>
      <p>In consideration of the said payment, I/we hereby irrevocably authorise Alpha Direct Insurance
      Company, in rem suam, in my/our name to dispose of the salvage of <b>${$('reg')}</b> and to retain
      any proceeds as its sole and absolute property.</p>
      <p>I/we understand that signing this Agreement of Loss is not an admission of liability in any
      manner whatsoever and is without prejudice to Alpha Direct Insurance Company.</p>
      <p>Dated at ……………………………………… on this ………… day of ……………………… 20……</p>
    </div>
    ${signBlock('Claimant as owner / Signature','Witness name / Signature')}`,

  // ---- Cash in Lieu of Repairs (faithful to pulled template) ----
  cil: () => `
    <div class="doctitle"><h2>Cash in Lieu of Repairs</h2></div>
    <div class="wp">WITHOUT PREJUDICE</div>
    ${metaRows()}
    <div class="body">
      <p>This letter confirms that Alpha Direct Insurance Company has agreed to settle the above claim by
      way of <b>cash in lieu of repairs</b>. The amount below is calculated as per the assessed repair
      costs and the terms of the policy, and is paid in full and final settlement of the claim.</p>
      ${finRows('Claim Costs (as per invoices)')}
      <p>Payment will be made to <b>${$('payee')}</b>. Acceptance of this amount constitutes full and
      final settlement of the claim, and Alpha Direct Insurance Company shall have no further liability
      in respect of this loss. This offer is made without prejudice and is not an admission of liability.</p>
      <p>Dated at ……………………………………… on this ………… day of ……………………… 20……</p>
    </div>
    ${signBlock('Claimant / Signature','Claims Officer / Signature')}`,

  // ---- Ex Gratia (standard draft) ----
  exg: () => `
    <div class="doctitle"><h2>Ex Gratia Offer</h2></div>
    <div class="wp">WITHOUT PREJUDICE</div>
    ${metaRows()}
    <div class="body">
      <p>Dear ${$('insured')},</p>
      <p>Following our review of the above claim, and while liability is not admitted under the policy,
      Alpha Direct Insurance Company is prepared to make an <b>ex gratia</b> (goodwill) payment of
      <b>BWP ${$('total')}</b> in respect of the loss that occurred on ${$('dol')}.</p>
      <p><b>Description of the loss:</b> ${$('desc')}</p>
      <p>This ex gratia payment is made as a gesture of goodwill only. It is <b>not</b> an admission of
      liability, does not set a precedent, and is offered in full and final settlement of the claim.
      Acceptance below confirms your agreement to these terms.</p>
      <p>Dated at ……………………………………… on this ………… day of ……………………… 20……</p>
    </div>
    ${signBlock('Claimant / Signature','Authorised by (Alpha Direct)')}`,

  // ---- Form of Release (standard draft) ----
  release: () => `
    <div class="doctitle"><h2>Form of Release</h2></div>
    <div class="wp">WITHOUT PREJUDICE</div>
    ${metaRows()}
    <div class="body">
      <p>In consideration of the payment of <b>BWP ${$('total')}</b> by Alpha Direct Insurance Company,
      the receipt of which is hereby acknowledged, I/we, <b>${$('insured')}</b>, release and forever
      discharge Alpha Direct Insurance Company, its servants and agents, from all claims, demands, actions
      and liabilities of whatsoever nature arising directly or indirectly out of the loss that occurred on
      ${$('dol')} in respect of vehicle ${$('reg')} (claim ${$('claimno')}).</p>
      <p>I/we confirm that this payment is accepted in full and final settlement of the claim, that no
      further claim will be made against the Company in respect of this loss, and that the signing of this
      release is not an admission of liability by the Company and is without prejudice.</p>
      <p>Dated at ……………………………………… on this ………… day of ……………………… 20……</p>
    </div>
    ${signBlock('Claimant / Signature','Witness name / Signature')}`,

  // ---- Refund Memo (standard draft) ----
  refund: () => `
    <div class="doctitle"><h2>Refund Memo</h2></div>
    ${metaRows()}
    <div class="body">
      <p><b>Refund to:</b> ${$('payee')}</p>
      <p><b>Reason for refund:</b> ${$('extra')}</p>
      <p>This memo authorises a refund of <b>BWP ${$('total')}</b> in respect of policy ${$('policyno')}
      (${$('insured')}). The refund has been verified against the policy and claim records and is
      recommended for payment in line with the claims and finance procedures.</p>
      ${finRows('Amount refundable')}
      <p>Dated at ……………………………………… on this ………… day of ……………………… 20……</p>
    </div>
    ${signBlock('Prepared by (Claims)','Approved by (Finance)')}`,

  // ---- Towing Authorisation (standard draft) ----
  towing: () => `
    <div class="doctitle"><h2>Towing Authorisation</h2></div>
    ${metaRows()}
    <div class="body">
      <p>Alpha Direct Insurance Company hereby authorises <b>${$('payee')}</b> to tow and transport the
      insured vehicle <b>${$('reg')}</b> in respect of claim ${$('claimno')}.</p>
      <p><b>Route / instruction:</b> ${$('extra')}</p>
      <p>This authorisation is issued for the safe recovery and storage of the vehicle pending assessment.
      Towing and storage charges are subject to Alpha Direct's approved tariff and the terms of the policy.
      This authorisation is not an admission of liability and is without prejudice.</p>
      <p>Dated at ……………………………………… on this ………… day of ……………………… 20……</p>
    </div>
    ${signBlock('Authorised by (Claims)','Service provider / Signature')}`,

  // ---- Claim Flagging Form (standard draft) ----
  flag: () => `
    <div class="doctitle"><h2>Claim Flagging Form</h2></div>
    <div class="approve">Internal — for claims review / investigation</div>
    ${metaRows()}
    <div class="body">
      <p><b>Reason for flagging:</b> ${$('extra')}</p>
      <p><b>Description / observations:</b> ${$('desc')}</p>
      <p>This claim has been flagged for further review by the Claims Department. Settlement is to be held
      pending the outcome of the review. Findings and the recommended action are to be recorded below and
      escalated to the Claims Manager.</p>
      <table class="meta">
        <tr><td class="k">Flagged by</td><td>&nbsp;</td></tr>
        <tr><td class="k">Date flagged</td><td>&nbsp;</td></tr>
        <tr><td class="k">Recommended action</td><td>&nbsp;</td></tr>
      </table>
    </div>
    ${signBlock('Flagged by (Claims)','Reviewed by (Claims Manager)')}`
};

function render(){
  const t = document.getElementById('doctype').value;
  document.getElementById('typeflag').textContent = FLAGTXT[t];
  document.getElementById('typeflag').style.background = FAITHFUL[t] ? '#eaf7ee' : '#fff5e9';
  document.getElementById('typeflag').style.borderLeftColor = FAITHFUL[t] ? '#1a7a3a' : '#F47C20';
  const draftNote = FAITHFUL[t] ? '' : `<div class="draft-note">Draft wording — confirm against the Claims Department's Word template before issuing to a client.</div>`;
  document.getElementById('page').innerHTML = LETTERHEAD + draftNote + TEMPLATES[t]() + FOOT;
}
const _t=new URLSearchParams(location.search).get("type");
if(_t && TEMPLATES[_t]) document.getElementById("doctype").value=_t;
render();
</script>
</body>
</html>
