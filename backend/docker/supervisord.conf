[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=15
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=3600

# Dedicated worker for the Smart Underwriting extraction queue. The job is
# dispatched with ->onQueue('smartuw'); the default queue-worker above has no
# --queue flag so it only drains 'default', leaving smartuw jobs parked
# (symptom: upload stuck "Extracting" indefinitely). --timeout=1260 > the job's
# $timeout=1200; --tries=1 matches the job (no retries by design).
#
# The CONNECTION is taken from QUEUE_CONNECTION, not hardcoded to redis. It was
# `queue:work redis` while the app runs QUEUE_CONNECTION=database, so dispatched
# jobs landed in the `jobs` table on queue 'smartuw' and this worker sat idle on
# an empty Redis list — indistinguishable, from the UI, from having no worker at
# all. Wrapped in sh -c so the env var actually expands; the default keeps a
# valid connection name if the var is unset.
#
# NOTE: this worker is now only a FALLBACK. Extraction is primarily started as a
# detached CLI process by SmartUnderwritingExtractJob::start(), which needs no
# worker at all.
[program:smartuw-worker]
command=/bin/sh -c "php /var/www/html/artisan queue:work ${QUEUE_CONNECTION:-database} --queue=smartuw --sleep=3 --tries=1 --max-time=3600 --timeout=1260"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=16
numprocs=1
stopwaitsecs=3600

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction 2>&1; sleep 60; done"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
