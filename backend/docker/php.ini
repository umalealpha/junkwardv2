; Custom PHP settings for Graphite
upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
; Don't advertise the PHP version in the X-Powered-By response header, and
; never render errors/stack traces into an HTTP response.
expose_php = Off
display_errors = Off
display_startup_errors = Off

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
