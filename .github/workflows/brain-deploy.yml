name: Build & Push Alpha Brain

# Manual-only. The brain is deliberately NOT in deploy.yml's auto-staging
# pipeline: it ships as its own isolated container (see brain/README.md) and
# every deploy of it should be a deliberate act, not a side effect of a merge.
on:
  workflow_dispatch:
    inputs:
      redeploy_service:
        description: 'Also force-redeploy the alpha-brain ECS service to pull the new image'
        type: boolean
        default: false

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: 623467544388.dkr.ecr.af-south-1.amazonaws.com
  ECR_REPO: alpha-brain
  ECS_CLUSTER: graphite-cluster
  ECS_SERVICE: alpha-brain

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Run brain test suite (gate — must be 22/22 before any image ships)
        run: |
          cd brain
          npm install --omit=dev
          npm test

      - name: Build and push
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO"
          docker build -f brain/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "### Alpha Brain image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ECR_REPO:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Force-redeploy alpha-brain service (optional)
        if: ${{ inputs.redeploy_service }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment >/dev/null
          echo "- Service \`$ECS_SERVICE\` force-redeployed." >> $GITHUB_STEP_SUMMARY
